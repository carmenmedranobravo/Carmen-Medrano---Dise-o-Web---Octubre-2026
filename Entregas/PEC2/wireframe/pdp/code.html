<style>
    /* Hairline diagonal crossing wireframe placeholder */
    .wireframe-box {
      position: relative;
      background-color: #f3f4f6;
      border: 1px solid #d1d5db;
      overflow: hidden;
    }
    .wireframe-box::before,
    .wireframe-box::after {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }
    .wireframe-box::before {
      background: linear-gradient(to top right, transparent calc(50% - 0.5px), #d1d5db calc(50% - 0.5px), #d1d5db calc(50% + 0.5px), transparent calc(50% + 0.5px));
    }
    .wireframe-box::after {
      background: linear-gradient(to bottom right, transparent calc(50% - 0.5px), #d1d5db calc(50% - 0.5px), #d1d5db calc(50% + 0.5px), transparent calc(50% + 0.5px));
    }
    .wireframe-box-clean {
      position: relative;
      background-color: #f3f4f6;
      border: 1px solid #d1d5db;
    }
    /* Simulated Text Bars */
    .text-skeleton {
      background-color: #e5e7eb;
      border-radius: 2px;
      display: inline-block;
    }
  </style>
