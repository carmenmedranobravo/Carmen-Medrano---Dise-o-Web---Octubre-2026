<style data-purpose="wireframe-cross">
    /* Diagonal cross pattern replicating sketch image placeholders */
    .wireframe-x {
      position: relative;
      background-color: #f8fafc;
      overflow: hidden;
    }
    .wireframe-x::before,
    .wireframe-x::after {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }
    .wireframe-x::before {
      background: linear-gradient(to top right, transparent calc(50% - 0.75px), #cbd5e1 calc(50% - 0.75px), #cbd5e1 calc(50% + 0.75px), transparent calc(50% + 0.75px));
